<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOSS 求职降噪助手</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 302px;
      margin: 0;
      background: #f7fbfa;
      color: #171a18;
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    main {
      display: grid;
      gap: 13px;
      padding: 16px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
    }

    p {
      margin: 0;
      color: #63584e;
      font-size: 12px;
      line-height: 1.55;
    }

    .badge {
      display: inline-flex;
      width: fit-content;
      min-height: 24px;
      align-items: center;
      padding: 3px 8px;
      border: 1px solid #9fded6;
      border-radius: 999px;
      background: #e6fffb;
      color: #115e59;
      font-size: 12px;
      font-weight: 800;
    }

    .box {
      display: grid;
      gap: 8px;
      padding: 11px;
      border: 1px solid #d6e3df;
      border-radius: 8px;
      background: #ffffff;
    }

    .box strong {
      color: #12433e;
      font-size: 12px;
    }

    .box ul {
      display: grid;
      gap: 5px;
      margin: 0;
      padding-left: 16px;
      color: #63584e;
      font-size: 12px;
      line-height: 1.45;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      height: 36px;
      border: 1px solid #0f766e;
      border-radius: 7px;
      background: #0f766e;
      color: #ecfeff;
      font-size: 13px;
      font-weight: 850;
      text-decoration: none;
    }

    .button:hover {
      background: #115e59;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">V0.5.15 标注同步修复版</span>
    <h1>BOSS 求职降噪助手</h1>
    <p>修复消息页已标注但数据面板仍显示未标记的问题。</p>
    <a class="button" href="dashboard.html" target="_blank" rel="noreferrer">打开数据面板</a>
    <section class="box">
      <strong>升级提醒</strong>
      <ul>
        <li>覆盖文件后在扩展页点重新加载。</li>
        <li>数据为空时，用右下角面板导入备份。</li>
      </ul>
    </section>
  </main>
</body>
</html>
