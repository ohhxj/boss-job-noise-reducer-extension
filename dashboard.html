<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>求职记录面板</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">BOSS 求职降噪助手</p>
        <h1>求职记录面板 <span>V0.5.15</span></h1>
      </div>
      <div class="toolbar">
        <button type="button" id="refreshButton">刷新</button>
        <button type="button" id="exportButton">导出 JSON</button>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="filters">
      <label>
        <span>视角</span>
        <select id="viewFilter">
          <option value="process">流程记录</option>
          <option value="all">全部职位</option>
          <option value="excluded">排除/暂存</option>
        </select>
      </label>
      <label>
        <span>状态</span>
        <select id="statusFilter">
          <option value="all">全部状态</option>
        </select>
      </label>
      <label>
        <span>日期</span>
        <select id="timeRange">
          <option value="all">全部</option>
          <option value="today" selected>今日</option>
          <option value="yesterday">昨天</option>
          <option value="7d">最近 7 天</option>
          <option value="30d">最近 30 天</option>
        </select>
      </label>
      <label>
        <span>时间字段</span>
        <select id="timeField">
          <option value="auto">自动</option>
          <option value="firstSeenAt">首次查看</option>
          <option value="firstCommunicatedAt">首次沟通</option>
          <option value="resumeSentAt">已发简历</option>
          <option value="interviewAt">面试</option>
          <option value="rejectedAt">被拒绝</option>
          <option value="unsuitableAt">不合适</option>
          <option value="lastMarkedAt">最近标记</option>
          <option value="lastSeenAt">最近看到</option>
        </select>
      </label>
      <label>
        <span>排序</span>
        <select id="sortSelect">
          <option value="updated">最近更新</option>
          <option value="company">公司名称</option>
          <option value="status">状态</option>
        </select>
      </label>
      <label class="search-field">
        <span>搜索</span>
        <input id="searchInput" type="search" placeholder="公司 / 岗位 / HR / 备注">
      </label>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>状态</th>
            <th>岗位</th>
            <th>公司</th>
            <th>HR</th>
            <th>薪资 / 城市</th>
            <th>备注</th>
            <th>最近更新</th>
            <th>链接</th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
      <div class="empty" id="emptyState">暂无记录</div>
    </section>
  </main>
  <script src="dashboard.js"></script>
</body>
</html>
